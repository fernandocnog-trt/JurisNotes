    <!-- ATUALIZAÇÃO PDF.JS V4 - CARREGAMENTO VIA MÓDULO -->
<script type="module">
    // 1. Importa a biblioteca usando a extensão .mjs (Módulo ES)
    import * as pdfjsLibModulo from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.mjs';

    // 2. Injeta a biblioteca globalmente para o seu app.js parar de dar erro
    window.pdfjsLib = pdfjsLibModulo;

    // 3. Define o "trabalhador" (worker) usando a mesma extensão .mjs
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/pdf.worker.mjs';
    
    // NOVO: Aponta o diretório oficial de fontes para evitar erros de renderização
    pdfjsLib.GlobalWorkerOptions.standardFontDataUrl = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.3.136/standard_fonts/';
</script>

        <div class="sidebar-tools">

                    </svg>
                </button>

                <button class="icon-btn" id="btn-gerador-contexto" onclick="abrirModalGeradorContexto()" title="Gerador de Contexto Estruturado para IA" style="display: none;">

                        <path d="M16 17H8"></path>
                        <path d="M10 9H8"></path>
                    </svg>
                </button>

                <button class="icon-btn tag-btn-ai" id="btn-acervo-modelos" title="Acervo de Modelos" style="display: none;" onclick="abrirModalAcervo()">

                <!-- ── Ferramentas Modulares Compartilhadas ─────────────────────── -->
                <hr class="toolbar-separator">
                
                <button class="icon-btn" id="btn-juris-relatorio" onclick="JurisRelatorioManager.abrirModal()" title="Juris Relatório (Geração Rápida de Decisão)">
                    <svg viewBox="0 0 24 24"><use href="#icon-quick-report"></use></svg>

                <div class="tool-separator"></div>

    <!-- 1. Bibliotecas Externas Estáticas (Fora do Bootstrapper p/ evitar bloqueios) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>

    <!-- 2. Container para injeção dinâmica de Modais -->
    <div id="modais-dinamicos-container"></div>

    <!-- 3. Bootstrapper de Inicialização Diferida (Agravo de Instrumento) -->
    <script>
        (async function AppBootstrapper() {
            try {
                // PASSO 1: Injeção Idempotente de Templates e Módulos (Assets de AI e Globais)
                const assets = [
                    { html: 'ai_modais.html', js: null, id: 'modal-gerador-contexto' },
                    // ATENÇÃO: Uso de '../' para voltar à raiz a partir da pasta do módulo AI
                    { html: '../ferramentas/juris-relatorio.template.html', js: '../ferramentas/juris-relatorio.js', id: 'modal-juris-relatorio' },
                    { html: '../ferramentas/juris-prompts.template.html', js: '../ferramentas/juris-prompts.js', id: 'modal-juris-prompts' }
                ];

                for (const asset of assets) {
                    if (!document.getElementById(asset.id)) {
                        const res = await fetch(asset.html);
                        if (res.ok) {
                            const htmlText = await res.text();
                            document.getElementById('modais-dinamicos-container').insertAdjacentHTML('beforeend', htmlText);
                            if (asset.js) await import(asset.js);
                        } else if (asset.html === 'ai_modais.html') {
                            throw new Error(`Falha no fetch do ai_modais.html (Status: ${res.status})`);
                        }
                    }
                }
                
                // PASSO 2: Fila ordenada de scripts locais da aplicação AI
                const scriptsParaCarregar = [
                    "js/ai_store.js",
                    "js/ai_backup-manager.js",
                    "js/ai_document-views.js",
                    "js/ai_topics-manager.js",
                    "js/ai_balanca-manager.js",
                    "js/ai_interaction-tools.js",
                    "js/ai_audio-manager.js",
                    "js/ai_juris-editor.js",
                    "js/ai_annotation-actions.js",
                    "js/ai_export-manager.js",
                    "js/ai_pdf-engine.js",
                    "js/ai_pje-parser.js",
                    "js/ai_app-core.js",
                    "js/ai_acervo-controller.js",
                    "js/ai_recommendation-service.js"
                ];

                for (const src of scriptsParaCarregar) {
                    await new Promise((resolve, reject) => {
                        const script = document.createElement('script');
                        script.src = src;
                        script.async = false; // Garante a ordem exata do array
                        script.onload = resolve;
                        script.onerror = () => reject(new Error(`O arquivo não foi encontrado ou foi bloqueado: ${src}`));
                        document.body.appendChild(script);
                    });
                }

                // PASSO 3: Disparo de Gatilho de Inicialização (Revive Menu e Listeners)
                window.document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true, cancelable: true }));
                window.dispatchEvent(new Event('load', { bubbles: true, cancelable: true }));

                // PASSO 4: Tudo carregado e inicializado. Removemos o Splash Screen.
                const splash = document.getElementById('juris-splash');
                if(splash) splash.style.display = 'none';

                console.log('🚀 Juris Notes (Agravo de Instrumento) inicializado com sucesso via Bootstrapper.');

            } catch (error) {
                console.error('🚨 Erro Crítico na Inicialização (AI):', error.message || error);
                const splashText = document.getElementById('splash-dynamic-text');
                if(splashText) splashText.innerText = "Erro ao carregar o sistema: " + (error.message || "Verifique o Console (F12).");
            }
        })();
    </script>

    <script type="module" src="js/ai_firebase-acervo.js" defer></script>
