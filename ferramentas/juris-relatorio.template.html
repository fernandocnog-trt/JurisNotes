<style>
    /* Estilos escopados para o Juris Relatório */
    .jr-container { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #1e293b; }
    .jr-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.25rem; }
    @media (max-width: 650px) { .jr-form-grid { grid-template-columns: 1fr; gap: 1rem; } }
    .jr-form-group { margin-bottom: 1.25rem; }
    .jr-form-group label { display: block; margin-bottom: 0.5rem; font-size: 0.85rem; font-weight: 600; color: #64748b; text-transform: uppercase; }
    .jr-form-control { width: 100%; padding: 0.75rem 1rem; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 1rem; color: #1e293b; transition: all 0.3s ease; font-family: inherit; }
    select.jr-form-control { cursor: pointer; appearance: auto; }
    .jr-form-control:focus { outline: none; border-color: var(--theme-primary, #ffc107); box-shadow: 0 0 0 3px var(--theme-light-border, rgba(255, 193, 7, 0.2)); }
    .jr-sub-section { background-color: #ffffff; border: 1px solid #e2e8f0; padding: 1.5rem; border-radius: 8px; margin-bottom: 1.25rem; }
    
    /* Animações e Condicionais */
    @keyframes jrFadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    .jr-conditional { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px dashed #e2e8f0; animation: jrFadeIn 0.3s ease; }
    
    .jr-btn { background-color: var(--theme-primary, #ffc107); color: var(--theme-text-on-primary, #000); box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 1rem 2rem; border-radius: 8px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background-color 0.2s ease; display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; text-transform: uppercase; }
    .jr-btn:hover { background-color: var(--theme-hover, #e0a800); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
    .jr-locked { background-color: #f8fafc; color: #64748b; border-style: dashed; cursor: not-allowed; line-height: 1.6; min-height: 250px; font-family: monospace; font-size: 0.95rem; resize: vertical; }
    
    /* Motor de Roteamento de Blocos do Juris Relatório */
    .jr-type-selector { display: flex; justify-content: space-between; gap: 1rem; background: #fff; padding: 12px 15px; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1.5rem; margin-top: 0;}
    .jr-type-selector fieldset { border: none; padding: 0; display: flex; width: 100%; justify-content: space-between; margin: 0; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    
    .jr-radio-label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; color: #64748b; transition: color 0.2s ease; margin: 0 !important; }
    .jr-radio-label:has(input:checked) { color: var(--theme-primary, #d97706); }
    .jr-radio-label input { accent-color: var(--theme-primary, #ffc107); transform: scale(1.1); }
    
    /* Acessibilidade para Opções Bloqueadas */
    .jr-radio-label:has(input:disabled) { opacity: 0.4; cursor: not-allowed; text-decoration: line-through; }
    .jr-radio-label input:disabled { cursor: not-allowed; }

    /* Alternância de Modo Declarativa */
    .jr-mode-block { display: none; }
    form[data-active-mode="RO"] #jr-block-recursos,
    form[data-active-mode="AP"] #jr-block-recursos,
    form[data-active-mode="ED"] #jr-block-ed,
    form[data-active-mode="AI"] #jr-block-ai { display: block; animation: jrFadeIn 0.3s ease; }
    
    form[data-active-mode="RO"] .field-ap-only { display: none !important; }
    form[data-active-mode="AP"] .field-ro-only { display: none !important; }
    form[data-active-mode="AP"] .field-ap-only { display: block !important; }
    
    /* Utilitários */
    .m-0 { margin: 0; }
    .mt-1 { margin-top: 1rem; }
    .mb-0 { margin-bottom: 0; }
    .mb-2 { margin-bottom: 2rem; }
</style>

<div class="modal-backdrop-modern" id="backdrop-juris-relatorio"></div>
<div class="doc-modal" id="modal-juris-relatorio" style="display: none; z-index: var(--z-outline-modal, 1000); max-width: 900px; width: 95%;">
    <div class="doc-modal__header">
        <h3 class="doc-modal__title">
            <svg viewBox="0 0 24 24" style="width:20px; height:20px; margin-right:8px; stroke: var(--theme-primary, #ffc107);"><use href="#icon-quick-report"></use></svg> 
            Dados do Relatório
        </h3>
        <div style="display: flex; gap: 12px; align-items: center;">
            <!-- Ícone semântico de Reset (Rotate CCW) com ARIA Label -->
            <button id="jr-btn-limpar" aria-label="Limpar formulário e iniciar novo rascunho" title="Limpar formulário" style="background: none; border: none; cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; transition: color 0.2s;">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                </svg>
            </button>
            <button class="doc-modal__close-btn" id="jr-btn-fechar">✕</button>
        </div>
    </div>
    
    <div class="doc-modal__content jr-container" style="background-color: #f1f5f9; padding: 20px; overflow-y: auto; max-height: calc(100vh - 120px);">
        
        <form id="jr-relatorio-form" data-active-mode="RO">
            
            <div class="jr-type-selector">
                <fieldset>
                    <legend class="sr-only">Selecione o tipo de incidente processual</legend>
                    <label class="jr-radio-label" title="Recurso Ordinário">
                        <input type="radio" name="jr_tipo" value="RO" checked> RO
                    </label>
                    <label class="jr-radio-label" title="Agravo de Petição">
                        <input type="radio" name="jr_tipo" value="AP"> AP
                    </label>
                    <label class="jr-radio-label" title="Embargos de Declaração">
                        <input type="radio" name="jr_tipo" value="ED"> ED
                    </label>
                    <label class="jr-radio-label" title="Agravo de Instrumento">
                        <input type="radio" name="jr_tipo" value="AI"> AI
                    </label>
                </fieldset>
            </div>
            
            <!-- BLOCO 1: RECURSOS (RO e AP) -->
            <div id="jr-block-recursos" class="jr-mode-block">
                <div class="jr-form-grid">
                    <div class="jr-form-group m-0">
                        <label>[A] Nome do(a) Magistrado(a)</label>
                        <input type="text" id="jr-magistrado" class="jr-form-control" placeholder="Ex: João da Silva">
                    </div>
                    <div class="jr-form-group m-0">
                        <label>[B] Titularidade</label>
                        <select id="jr-titularidade" class="jr-form-control">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Juiz(a) do Trabalho Titular">Juiz(a) do Trabalho Titular</option>
                            <option value="Juiz(a) do Trabalho Substituto(a)">Juiz(a) do Trabalho Substituto(a)</option>
                        </select>
                    </div>
                </div>

                <div class="jr-form-grid">
                    <div class="jr-form-group m-0">
                        <label>[C] Vara de Origem</label>
                        <input type="text" id="jr-vara" class="jr-form-control" placeholder="Ex: 3ª VARA DE VÁRZEA GRANDE">
                    </div>
                    <div class="jr-form-group m-0">
                        <label id="lbl-d" class="dyn-label" data-text-ro="[D] Sentença Principal (Fls. e ID)" data-text-ap="[D] Decisão Agravada (Fls. e ID)">[D] Sentença Principal (Fls. e ID)</label>
                        <input type="text" id="jr-sentenca" class="jr-form-control" placeholder="Ex: 224/232 - Id. 39e6404">
                    </div>
                </div>

                <div class="jr-form-group">
                    <label id="lbl-e" class="dyn-label" data-text-ro="[E] Resultado da Sentença" data-text-ap="[E] Síntese do Julgado">[E] Resultado da Sentença</label>
                    <select id="jr-resultado" class="jr-form-control field-ro-only">
                        <option value="" disabled selected>Selecione...</option>
                        <option value="PROCEDENTES">Procedentes</option>
                        <option value="IMPROCEDENTES">Improcedentes</option>
                        <option value="PROCEDENTES EM PARTE">Procedentes em parte</option>
                    </select>
                    <input type="text" id="jr-resultado-ap" class="jr-form-control field-ap-only" placeholder="Ex: julgou improcedentes os embargos..." style="display: none;">
                </div>

                <div class="jr-sub-section">
                    <div class="jr-form-group m-0">
                        <label id="lbl-f" class="dyn-label" data-text-ro="[F] Recurso Ordinário" data-text-ap="[F] Agravo de Petição">[F] Recurso Ordinário</label>
                        <select id="jr-recurso" class="jr-form-control">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="1" class="dyn-opt" data-text-ro="Parte autora" data-text-ap="Parte exequente">Parte autora</option>
                            <option value="2" class="dyn-opt" data-text-ro="Parte ré" data-text-ap="Parte executada">Parte ré</option>
                            <option value="3" class="dyn-opt" data-text-ro="Ambas as partes" data-text-ap="Ambas as partes">Ambas as partes</option>
                        </select>
                    </div>
                    <div class="jr-form-group mt-1 mb-0">
                        <label id="lbl-f1" class="dyn-label" data-text-ro="[F.1] Fls. e Id do(s) Recurso(s)" data-text-ap="[F.1] Fls. e Id do(s) Agravo(s)">[F.1] Fls. e Id do(s) Recurso(s)</label>
                        <input type="text" id="jr-recurso-fls" class="jr-form-control" placeholder="Fls. / Id">
                    </div>
                </div>

                <div class="jr-sub-section">
                    <div class="jr-form-group m-0">
                        <label>[G] Embargos de Declaração</label>
                        <select id="jr-embargos" class="jr-form-control trigger-conditional">
                            <option value="0" class="dyn-opt" data-text-ro="Não houve (0)" data-text-ap="Não houve (0)" selected>Não houve (0)</option>
                            <option value="1" class="dyn-opt" data-text-ro="Opostos pela autora (1)" data-text-ap="Opostos pela exequente (1)">Opostos pela autora (1)</option>
                            <option value="2" class="dyn-opt" data-text-ro="Opostos pela ré (2)" data-text-ap="Opostos pela executada (2)">Opostos pela ré (2)</option>
                            <option value="3" class="dyn-opt" data-text-ro="Opostos por ambas (3)" data-text-ap="Opostos por ambas (3)">Opostos por ambas (3)</option>
                        </select>
                    </div>
                    
                    <div id="jr-embargos-detalhes" class="jr-conditional">
                        <div class="jr-form-grid">
                            <div class="jr-form-group m-0">
                                <label>[G.1] Fls. de oposição</label>
                                <input type="text" id="jr-embargos-fls" class="jr-form-control" placeholder="Fls. / Id">
                            </div>
                            <div class="jr-form-group m-0">
                                <label>[G.2] Resultado</label>
                                <select id="jr-embargos-resultado" class="jr-form-control">
                                    <option value="" disabled selected>Selecione...</option>
                                    <option value="Acolhidos">Acolhidos</option>
                                    <option value="Rejeitados">Rejeitados</option>
                                    <option value="Acolhidos em parte">Acolhidos em parte</option>
                                </select>
                            </div>
                        </div>
                        <div class="jr-form-group mt-1 mb-0">
                            <label id="lbl-g3" class="dyn-label" data-text-ro="[G.3] Sentença dos Embargos (Fls. e ID)" data-text-ap="[G.3] Decisão dos Embargos (Fls. e ID)">[G.3] Sentença dos Embargos (Fls. e ID)</label>
                            <input type="text" id="jr-embargos-sentenca" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                    </div>
                </div>

                <div class="jr-sub-section mb-2">
                    <div class="jr-form-group m-0">
                        <label id="lbl-h" class="dyn-label" data-text-ro="[H] Contrarrazões" data-text-ap="[H] Contraminuta">[H] Contrarrazões</label>
                        <select id="jr-contrarrazoes" class="jr-form-control trigger-conditional">
                            <option value="0" class="dyn-opt" data-text-ro="Não ofertadas (0)" data-text-ap="Não ofertada (0)" selected>Não ofertadas (0)</option>
                            <option value="1" class="dyn-opt" data-text-ro="Ofertadas pela autora (1)" data-text-ap="Ofertadas pela exequente (1)">Ofertadas pela autora (1)</option>
                            <option value="2" class="dyn-opt" data-text-ro="Ofertadas pela ré (2)" data-text-ap="Ofertadas pela executada (2)">Ofertadas pela ré (2)</option>
                            <option value="3" class="dyn-opt" data-text-ro="Ofertadas por ambas (3)" data-text-ap="Ofertadas por ambas (3)">Ofertadas por ambas (3)</option>
                        </select>
                    </div>
                    
                    <div id="jr-contrarrazoes-detalhes" class="jr-conditional">
                        <div class="jr-form-group m-0">
                            <label id="lbl-h1" class="dyn-label" data-text-ro="[H.1] Fls. e Id das Contrarrazões" data-text-ap="[H.1] Fls. e Id da(s) Contraminuta(s)">[H.1] Fls. e Id das Contrarrazões</label>
                            <input type="text" id="jr-contrarrazoes-fls" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                    </div>
                </div>
            </div>

            <!-- BLOCO 2: EMBARGOS DE DECLARAÇÃO (ED) -->
            <div id="jr-block-ed" class="jr-mode-block">
                <div class="jr-sub-section">
                    <div class="jr-form-group m-0">
                        <label>[A] Embargante</label>
                        <select id="jr-ed-embargante" class="jr-form-control">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Parte reclamante">Parte reclamante</option>
                            <option value="Parte reclamada">Parte reclamada</option>
                            <option value="Ambas as partes">Ambas as partes</option>
                        </select>
                    </div>
                    <div class="jr-form-group mt-1 mb-0">
                        <label>[A.1] Fls. e Id dos Embargos</label>
                        <input type="text" id="jr-ed-fls" class="jr-form-control" placeholder="Ex: 224/232 - Id. 39e6404">
                    </div>
                </div>
                <div class="jr-form-group">
                    <label>[B] Acórdão Embargado (Fls. e ID)</label>
                    <input type="text" id="jr-ed-acordao" class="jr-form-control" placeholder="Ex: 280/295 - Id. 9f8e7d">
                </div>
                <div class="jr-form-group">
                    <label>[C] Vícios Alegados</label>
                    <input type="text" id="jr-ed-vicios" class="jr-form-control" placeholder="Ex: omissão / contradição / erro material">
                </div>
                <div class="jr-sub-section mb-2">
                    <div class="jr-form-group m-0">
                        <label>[D] Contraditório / Efeito Modificativo</label>
                        <select id="jr-ed-contraditorio" class="jr-form-control trigger-conditional">
                            <option value="0" selected>Não houve intimação da parte contrária (0)</option>
                            <option value="1">Manifestação apresentada (1)</option>
                            <option value="2">Prazo transcorrido in albis - sem manifestação (2)</option>
                        </select>
                    </div>
                    <div id="jr-ed-contraditorio-detalhes" class="jr-conditional">
                        <div class="jr-form-group m-0" id="jr-ed-despacho-container">
                            <label>[D.1] Fls. e Id do Despacho de Intimação</label>
                            <input type="text" id="jr-ed-despacho-fls" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                        <div class="jr-form-group mt-1" id="jr-ed-manifestacao-container">
                            <label>[D.2] Fls. e Id da Manifestação</label>
                            <input type="text" id="jr-ed-manifestacao-fls" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                    </div>
                </div>
            </div>

            <!-- BLOCO 3: AGRAVO DE INSTRUMENTO (AI) -->
            <div id="jr-block-ai" class="jr-mode-block">
                <div class="jr-sub-section">
                    <div class="jr-form-group m-0">
                        <label>[A] Agravante (Quem teve o recurso trancado)</label>
                        <select id="jr-ai-agravante" class="jr-form-control">
                            <option value="" disabled selected>Selecione...</option>
                            <option value="Parte reclamante">Parte reclamante</option>
                            <option value="Parte reclamada">Parte reclamada</option>
                            <option value="Ambas as partes">Ambas as partes</option>
                        </select>
                    </div>
                    <div class="jr-form-group mt-1 mb-0">
                        <label>[A.1] Fls. e Id do(s) Agravo(s) de Instrumento</label>
                        <input type="text" id="jr-ai-fls" class="jr-form-control" placeholder="Ex: 224/232 - Id. 39e6404">
                    </div>
                </div>
                <div class="jr-form-grid">
                    <div class="jr-form-group m-0">
                        <label>[B] Recurso Denegado</label>
                        <input type="text" id="jr-ai-recurso" class="jr-form-control" placeholder="Ex: Recurso Ordinário">
                    </div>
                    <div class="jr-form-group m-0">
                        <label>[C] Despacho Denegatório (Fls e Id)</label>
                        <input type="text" id="jr-ai-despacho" class="jr-form-control" placeholder="Ex: 345/346 - Id. 9z8y7x">
                    </div>
                </div>
                <div class="jr-sub-section">
                    <div class="jr-form-group m-0">
                        <label>[D] Contraminuta ao Agravo (Fls. e ID)</label>
                        <select id="jr-ai-contraminuta" class="jr-form-control trigger-conditional">
                            <option value="0" selected>Não ofertada (0)</option>
                            <option value="1">Ofertada pela reclamante (1)</option>
                            <option value="2">Ofertada pela reclamada (2)</option>
                            <option value="3">Ofertada por ambas (3)</option>
                        </select>
                    </div>
                    <div id="jr-ai-contraminuta-detalhes" class="jr-conditional">
                        <div class="jr-form-group m-0">
                            <label>[D.1] Fls. e Id da Contraminuta</label>
                            <input type="text" id="jr-ai-contraminuta-fls" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                    </div>
                </div>
                <div class="jr-sub-section mb-2">
                    <div class="jr-form-group m-0">
                        <label>[E] Contrarrazões ao Recurso Principal</label>
                        <select id="jr-ai-contrarraz" class="jr-form-control trigger-conditional">
                            <option value="0" selected>Não ofertadas (0)</option>
                            <option value="1">Ofertadas pela reclamante (1)</option>
                            <option value="2">Ofertadas pela reclamada (2)</option>
                            <option value="3">Ofertadas por ambas (3)</option>
                        </select>
                    </div>
                    <div id="jr-ai-contrarraz-detalhes" class="jr-conditional">
                        <div class="jr-form-group m-0">
                            <label>[E.1] Fls. e Id das Contrarrazões</label>
                            <input type="text" id="jr-ai-contrarraz-fls" class="jr-form-control" placeholder="Fls. / Id">
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <!-- PRÉ-VISUALIZAÇÃO -->
        <div style="background-color: #fff; padding: 1.5rem; border-radius: 8px; border: 1px solid #e2e8f0; margin-bottom: 1rem;">
            <h4 style="margin-bottom: 1rem; color: #1e293b;">Pré-visualização do Documento</h4>
            <textarea id="jr-preview-text" class="jr-form-control jr-locked" readonly></textarea>
        </div>

        <button id="jr-btn-copiar" class="jr-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Copiar Relatório
        </button>

    </div>
</div>
